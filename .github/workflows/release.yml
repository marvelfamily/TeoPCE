name: Build Catalog Manager
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - name: Run tests with hang diagnostics
        run: >-
          python -c "import faulthandler, unittest; faulthandler.dump_traceback_later(45, repeat=True); unittest.main(module=None, argv=['unittest', 'discover', '-s', 'tests', '-v'])"
        timeout-minutes: 3
      - run: python tools/build_manager.py --resources resources --output dist
      - name: Check Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process 'dist/TeoPCE Catalog Manager.exe' -ArgumentList '--smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Manager failed with exit $($process.ExitCode)" }
      - name: Sign macOS application
        if: runner.os == 'macOS'
        run: |
          xattr -cr "dist/TeoPCE Catalog Manager.app"
          codesign --force --deep --sign - "dist/TeoPCE Catalog Manager.app"
          codesign --verify --deep --strict "dist/TeoPCE Catalog Manager.app"
      - name: Check macOS application
        if: runner.os == 'macOS'
        run: '"dist/TeoPCE Catalog Manager.app/Contents/MacOS/TeoPCE Catalog Manager" --smoke'
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: |
          mkdir -p package/TeoPCE
          mv "dist/TeoPCE Catalog Manager.app" package/TeoPCE/
          cp -R LICENSE THIRD-PARTY.md README.md CHANGELOG.md CONTRIBUTING.md RELEASE-STATUS.md VERIFICATION.json licenses docs package/TeoPCE/
          ditto -c -k --keepParent --norsrc package/TeoPCE TeoPCE-Manager-${{ runner.os }}-${{ runner.arch }}.zip
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE,THIRD-PARTY.md,README.md,CHANGELOG.md,CONTRIBUTING.md,RELEASE-STATUS.md,VERIFICATION.json dist/
          Copy-Item -Recurse licenses dist/
          Copy-Item -Recurse docs dist/
          Compress-Archive -Path dist/* -DestinationPath TeoPCE-Manager-${{ runner.os }}-${{ runner.arch }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TeoPCE-Manager-${{ matrix.os }}-${{ runner.arch }}
          path: TeoPCE-Manager-*.zip
