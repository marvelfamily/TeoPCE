name: Feature request
description: Suggest a focused improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What is difficult today?
      description: Describe the task and where the current experience gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How would this help, and what should stay unchanged?
    validations:
      required: true
