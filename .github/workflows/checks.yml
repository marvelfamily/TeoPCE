name: Portable checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run tests with hang diagnostics
        run: >-
          python -c "import faulthandler, unittest; faulthandler.dump_traceback_later(45, repeat=True); unittest.main(module=None, argv=['unittest', 'discover', '-s', 'tests', '-v'])"
        timeout-minutes: 3
